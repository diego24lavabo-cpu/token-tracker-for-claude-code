name: Release

# Pushing a version tag (v0.1.0) builds the macOS and Windows apps and creates a draft
# GitHub Release with them; publish the draft by hand after checking it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
            files: |
              release/*.dmg
          - name: Windows
            os: windows-latest
            script: dist:win
            files: |
              release/*-setup.exe
              release/*-portable.exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag against package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node scripts/changelog-section.mjs "$version" > /dev/null

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # ── Code signing (off: the builds are unsigned for now) ─────────────────────────
      # macOS needs an Apple Developer ID ("Developer ID Application" certificate) and
      # notarization. Add the repository secrets, then uncomment the env block of the
      # build step below and, in electron-builder.yml, remove `identity: '-'`, set
      # `hardenedRuntime: true` and `notarize: true`:
      #   CSC_LINK                     base64 of the exported .p12 certificate
      #   CSC_KEY_PASSWORD             its password
      #   APPLE_ID                     the Apple account email
      #   APPLE_APP_SPECIFIC_PASSWORD  an app-specific password of that account
      #   APPLE_TEAM_ID                the 10-character team id
      # Windows needs a code-signing certificate (OV/EV, or a cloud signing service):
      #   WIN_CSC_LINK                 base64 of the .pfx certificate
      #   WIN_CSC_KEY_PASSWORD         its password
      - name: Build
        run: npm run ${{ matrix.script }}
        # env:
        #   CSC_LINK: ${{ secrets.CSC_LINK }}
        #   CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        #   WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        #   WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > notes.md
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A re-run: replace the files and notes of the existing draft.
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --draft \
              --verify-tag \
              --title "Token Tracker for Claude Code $version" \
              --notes-file notes.md
          fi
